name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  guard:
    name: Validate Tag
    runs-on: depot-ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.tag.outputs.latest }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # feature releases must come from master, bugfix releases may come from any
      # branch. only the newest release moves the latest pointers.
      - id: tag
        env:
          MASTER_REF: origin/${{ github.event.repository.default_branch }}
        run: .github/scripts/release-tag.sh "${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

  call-build-workflow:
    if: startsWith(github.ref, 'refs/tags')
    uses: Derich367/evcc/.github/workflows/default.yml@master
    permissions:
      contents: read
      actions: write

  docker:
    name: Publish Docker :release
    needs:
      - guard
      - call-build-workflow
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # depot builders keep the Dockerfile's cache mounts on their own volumes,
      # so they need neither buildx nor the cache dance
      - name: Setup Depot
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

      - name: Meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: |
            ghcr.io/derich367/evcc

      - name: Publish
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: ${{ secrets.DEPOT_PROJECT_ID }}
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6
          push: true
          build-args: |
            RELEASE=1
          tags: ${{ steps.meta.outputs.tags }}


  hassio:
    name: Hassio Addon
    needs:
      - guard
      - docker
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: Derich367/evcc-hassio-addon
          token: ${{ secrets.HASSIO_DEPLOY_TOKEN }}
          path: ./hassio

      - name: Update version
        run: |
          sed -i -e s#version.*#version\:\ $(echo ${{ github.ref }} | sed -e s#refs/tags/##)# ./hassio/evcc/config.yaml

      - name: Push
        run: |
          cd ./hassio
          git add .
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Mirror evcc release"
          git push

  cleanup:
    name: Delete Release Branch
    needs:
      - docker
    runs-on: depot-ubuntu-24.04-arm

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      # a bugfix release consumes its release branch, e.g. tag 0.313.1 is the tip
      # of release/0.313.1. Feature releases have no such branch.
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          branch="release/$TAG"

          head=$(git rev-parse --verify --quiet "origin/$branch") || {
            echo "::notice::no $branch to delete"
            exit 0
          }

          if [ "$head" != "$(git rev-parse "$TAG^{commit}")" ]; then
            echo "::notice::$branch moved past $TAG, keeping it"
            exit 0
          fi

          git push origin --delete "$branch"
