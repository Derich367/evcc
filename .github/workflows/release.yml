name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  guard:
    name: Validate Tag
    runs-on: depot-ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.tag.outputs.latest }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # feature releases must come from master, bugfix releases may come from any
      # branch. only the newest release moves the latest pointers.
      - id: tag
        env:
          MASTER_REF: origin/${{ github.event.repository.default_branch }}
        run: .github/scripts/release-tag.sh "${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

  call-build-workflow:
    needs:
      - guard
    uses: evcc-io/evcc/.github/workflows/default.yml@master
    permissions:
      contents: read
      actions: write

  docker:
    name: Publish Docker :release
    needs:
      - guard
      - call-build-workflow
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: api.repoflow.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: |
            evcc/evcc
          # a bugfix release of an older line must not move :latest
          flavor: |
            latest=${{ needs.guard.outputs.latest }}

      - name: Publish
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6
          push: true
          build-args: |
            RELEASE=1
          tags: ${{ steps.meta.outputs.tags }}


  hassio:
    name: Hassio Addon
    needs:
      - guard
      - docker
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: Derich367/evcc-hassio-addon
          token: ${{ secrets.GH_TOKEN }}
          path: ./hassio

      - name: Update version
        run: |
          sed -i -e s#version.*#version\:\ $(echo ${{ github.ref }} | sed -e s#refs/tags/##)# ./hassio/evcc/config.yaml

      - name: Push
        run: |
          cd ./hassio
          git add .
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Mirror evcc release"
          git push

  cleanup:
    name: Delete Release Branch
    needs:
      - docker
      - apt
    runs-on: depot-ubuntu-24.04-arm

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      # a bugfix release consumes its release branch, e.g. tag 0.313.1 is the tip
      # of release/0.313.1. Feature releases have no such branch.
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          branch="release/$TAG"

          head=$(git rev-parse --verify --quiet "origin/$branch") || {
            echo "::notice::no $branch to delete"
            exit 0
          }

          if [ "$head" != "$(git rev-parse "$TAG^{commit}")" ]; then
            echo "::notice::$branch moved past $TAG, keeping it"
            exit 0
          fi

          git push origin --delete "$branch"
